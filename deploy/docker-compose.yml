services:
  api-web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - ../.env
    ports:
      - "8080:8080"
    command: ["pnpm", "start"]
    restart: unless-stopped

  trading-bot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - ../.env
    command: ["pnpm", "bot:live"]
    restart: unless-stopped
